name: pipeline

on:
  pull_request:
    branches:
      - main
      - DEV
  push:
    branches:
      - main
      - DEV

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgres://test:123@localhost:5432/db_development"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: 123
          POSTGRES_DB: db_development
        ports:
          - 5432:5432
        options:
          --health-cmd="pg_isready -U test -d db_development"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Running migrations
        run: npm run db:migrate

      - name: Running seeds
        run: npm run db:seed

      - name: Start Server
        run: npm start &

      - name: Run tests
        run: npm run test:run
